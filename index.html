<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HD Store</title>
</head>
<body>
<p style="font-family:sans-serif;color:#666;">Taking you to our eBay store&hellip;
<a id="lnk" href="https://www.ebay.com/str/hdtoysstore">Click here if you are not redirected.</a></p>
<script>
(function () {
  var LOG = 'https://script.google.com/macros/s/AKfycbxl2rbofsot7m-8cYuhzgV-9ZHE20qtXWiZOoMJYPbDYQDr0DrinOgopuS2kYQBkXrFsQ/exec';
  var HOME = 'https://www.ebay.com/str/hdtoysstore';
  // 終了した出品 → 生きている同等商品 (ストア内検索) の対応表。
  // ⚠ この行は SNS自動配信/src/traffic/ended_links.py が自動生成して push する。
  //    手で書き換えないこと (次回同期で上書きされる)。 マーカーを消すと同期が失敗する。
  /*ENDED_START*/var ENDED={"286953709840": "https://www.ebay.com/str/hdjapanstore?_nkw=Logo", "287407542054": "https://www.ebay.com/str/hdjapanstore?_nkw=Supreme", "366574738432": "https://www.ebay.com/str/mtjapanstore?_nkw=Soundtrack"};/*ENDED_END*/
  var q = new URLSearchParams(location.search);
  var dest = q.get('u') || '';
  // 安全弁: eBay ドメイン以外へは飛ばさない (open redirect 防止)
  function safe(u) {
    try {
      var h = new URL(u).hostname;
      return /(^|\.)ebay\.(com|co\.jp|de|co\.uk|fr|it|es|com\.au|ca)$/.test(h);
    } catch (e) { return false; }
  }
  if (!safe(dest)) dest = HOME;
  // 終了品の救済 (2026-08-18): 投稿本文のリンクは書き換えられないが、 リンクは必ず
  // ここを通る。 終了 item はストア検索 (同キーワード) へ逃がす = 送客を捨てない。
  var item = q.get('i') || '';
  var ended = '';
  if (item && Object.prototype.hasOwnProperty.call(ENDED, item)) {
    var alt = ENDED[item];
    if (safe(alt)) { dest = alt; ended = '1'; }
  }
  document.getElementById('lnk').href = dest;
  // クリック記録 beacon (GAS doGet が platform×kind をカウント)。
  //
  // 2026-08-18 (v3 / HDC root fix): 「JS が動いた = 人間」は成り立たない。 リンク安全性
  // スキャナやプレビュー生成の多くは headless Chrome で JS を実行するため、 従来の生カウント
  // には bot が混ざる (実測: YouTube 枠が 37 日間 1 日 3〜4 件で減衰ゼロ = 人間の挙動でない)。
  // → **クライアント信号を beacon に載せて GAS 側で bot/人間を判定**する。 リクエストは
  //    従来どおり 1 本だけなので遷移は遅くならない。
  // ⚠ hb=1 が実クリック判定のスイッチ。 これを落とすと GAS 側は「判定不能」として
  //    実クリックを一切数えなくなる (= 静かに 0 になる)。 tracking_selftest.py が
  //    このページに hb=1 が居ることを日次で確認している。
  // ⚠ ed=1 は終了品の救済が発火したことを GAS に伝える (救済が効いているかの唯一の観測)。
  //
  // 2026-09-02 (HDC 調査用調査で発見): GAS 側の bot 判定 `_botReason` は最後の砦として
  // `not_visible` (=読み込み時に visibilityState が 'visible' でない) を bot 扱いにしていた。
  // 実際にはバックグラウンドタブで開かれたリンク、 X/IG/FB のアプリ内ブラウザの
  // 先行ロード、 prerender も同じ信号を出すため、 これらの **正当な人間クリック**まで
  // bot に数えられていた (実測: not_visible が bot 内訳で最多の 130 件)。
  // → 読み込み時に非可視なら、 最大 15 秒だけ visibilitychange で可視化を待ってから
  //   beacon+redirect を送る (可視化できたら vs='v' で送る)。 タイムアウトしたら
  //   従来どおりその時点の状態で送る (無期限に待って redirect を止めない)。
  function fireAndGo(vsChar) {
    try {
      var n = navigator, s = (typeof screen !== 'undefined' && screen) ? screen : {};
      var params = new URLSearchParams({
        pf: q.get('pf') || 'unknown', acc: q.get('acc') || '', k: q.get('k') || 'na',
        i: item, u: 'logged',
        hb: '1', ed: ended,
        ua: String(n.userAgent || '').slice(0, 180),
        wd: n.webdriver ? '1' : '0',
        sw: String(s.width || 0),
        lg: String((n.languages || []).length),
        hc: String(n.hardwareConcurrency || 0),
        vs: vsChar
      });
      fetch(LOG + '?' + params.toString(), { mode: 'no-cors', keepalive: true });
    } catch (e) { /* logging failure must not block redirect */ }
    setTimeout(function () { location.replace(dest); }, 120);
  }
  var initialVs = String(document.visibilityState || '?').charAt(0);
  if (initialVs !== 'v') {
    var settled = false;
    var onVisible = function () {
      if (settled || document.visibilityState !== 'visible') return;
      settled = true;
      document.removeEventListener('visibilitychange', onVisible);
      clearTimeout(waitTimer);
      fireAndGo('v');
    };
    document.addEventListener('visibilitychange', onVisible);
    var waitTimer = setTimeout(function () {
      if (settled) return;
      settled = true;
      document.removeEventListener('visibilitychange', onVisible);
      fireAndGo(String(document.visibilityState || '?').charAt(0));
    }, 15000);
  } else {
    fireAndGo('v');
  }
})();
</script>
</body>
</html>
